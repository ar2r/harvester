<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" role="img" aria-label="Состав проекта LedgerFox: Мои чеки онлайн, парсер, SQLite, Python-скрипты, AI CLI, AI-агент, AGENTS.md и артефакты" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="m-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#343A40"/></marker>
    <marker id="m-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#868E96"/></marker>
    <marker id="m-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker>
    <marker id="m-teal-r" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker>
    <marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D6336C"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="710" fill="#FFFFFF"/>

  <!-- ===================== Управление ===================== -->

  <!-- Пользователь -->
  <rect x="60" y="20" width="160" height="52" rx="10" fill="#FFFFFF" stroke="#343A40" stroke-width="1.6"/>
  <text x="140" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Пользователь</text>
  <text x="140" y="58" text-anchor="middle" font-size="10" fill="#495057">читает отчёты · руководит</text>

  <!-- AI-агент (ZCode) -->
  <rect x="280" y="20" width="200" height="52" rx="10" fill="#E6FAF7" stroke="#0CA678" stroke-width="1.6"/>
  <text x="380" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">AI-агент (ZCode)</text>
  <text x="380" y="58" text-anchor="middle" font-size="10" fill="#495057">чат · запуск целей · правки</text>

  <!-- AGENTS.md -->
  <rect x="700" y="20" width="240" height="52" rx="10" fill="#F0FDFA" stroke="#0CA678" stroke-width="1.2"/>
  <text x="820" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">AGENTS.md</text>
  <text x="820" y="58" text-anchor="middle" font-size="10" fill="#495057">инструкции для AI-агента</text>

  <!-- Makefile-цели -->
  <rect x="170" y="112" width="420" height="44" rx="8" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.4"/>
  <text x="380" y="131" text-anchor="middle" font-size="11" fill="#343A40">make parse · report · lkdr-report · ai-report · report-all</text>
  <text x="380" y="147" text-anchor="middle" font-size="10" fill="#495057">ручной запуск из терминала или AI-агентом</text>

  <!-- ===================== Конвейер данных ===================== -->

  <!-- Мои чеки онлайн (внешний сервис) -->
  <rect x="20" y="195" width="180" height="125" rx="12" fill="#FFF6E5" stroke="#E8960C" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="110" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">🧾 Мои чеки онлайн</text>
  <text x="110" y="244" text-anchor="middle" font-size="10.5" fill="#495057">внешний сервис ФНС</text>
  <text x="110" y="260" text-anchor="middle" font-size="10.5" fill="#495057">неофициальное API</text>
  <text x="110" y="280" text-anchor="middle" font-size="10" fill="#846409">SMS-код — только при</text>
  <text x="110" y="294" text-anchor="middle" font-size="10" fill="#846409">первой авторизации</text>
  <text x="110" y="310" text-anchor="middle" font-size="10" fill="#846409">токен → lkdr.db</text>

  <!-- Парсер -->
  <rect x="245" y="175" width="230" height="150" rx="10" fill="#E7F1FB" stroke="#2B7CD3" stroke-width="1.8"/>
  <text x="360" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Парсер · Go · bin/app</text>
  <text x="360" y="219" text-anchor="middle" font-size="11" fill="#212529">stdin-триггер — ручной запуск</text>
  <text x="360" y="237" text-anchor="middle" font-size="11" fill="#212529">job lkdr: Receipts → FiscalData</text>
  <text x="360" y="255" text-anchor="middle" font-size="11" fill="#212529">дозагрузка деталей и позиций</text>
  <text x="360" y="273" text-anchor="middle" font-size="11" fill="#212529">RuCaptcha — капча авторизации</text>
  <text x="360" y="291" text-anchor="middle" font-size="11" fill="#212529">UPSERT: чеки · бренды · токены</text>
  <text x="360" y="309" text-anchor="middle" font-size="10.5" fill="#6c757d">make parse · --stdin.user=all</text>

  <!-- SQLite -->
  <rect x="525" y="200" width="160" height="100" rx="10" fill="#E9F7EF" stroke="#2F9E62" stroke-width="1.8"/>
  <text x="605" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#212529">SQLite · lkdr.db</text>
  <text x="605" y="246" text-anchor="middle" font-size="10.5" fill="#495057">чеки · бренды</text>
  <text x="605" y="262" text-anchor="middle" font-size="10.5" fill="#495057">фискальные данные</text>
  <rect x="557" y="274" width="96" height="18" rx="9" fill="#D3F9D8"/>
  <text x="605" y="287" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2B8A3E">артефакт</text>

  <!-- Python-скрипты -->
  <rect x="725" y="175" width="255" height="150" rx="10" fill="#F4EDFB" stroke="#8E5AC8" stroke-width="1.8"/>
  <text x="852" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Python-скрипты · scripts/</text>
  <text x="852" y="219" text-anchor="middle" font-size="11" fill="#212529">report.py — меню (make report)</text>
  <text x="852" y="237" text-anchor="middle" font-size="11" fill="#212529">lkdr_report.py — текстовый / md</text>
  <text x="852" y="255" text-anchor="middle" font-size="11" fill="#212529">ai_report.py — HTML-отчёт месяца</text>
  <text x="852" y="273" text-anchor="middle" font-size="11" fill="#212529">templates/ — шаблон HTML-отчёта</text>
  <text x="852" y="291" text-anchor="middle" font-size="10.5" fill="#6c757d">make report · report-all · ai-report</text>

  <!-- ===================== AI и артефакты ===================== -->

  <!-- AI CLI -->
  <rect x="725" y="455" width="255" height="88" rx="10" fill="#FDEDF1" stroke="#D6336C" stroke-width="1.8"/>
  <text x="852" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">AI CLI · codex exec</text>
  <text x="852" y="500" text-anchor="middle" font-size="10.5" fill="#495057">прямой вызов из Python-скриптов</text>
  <text x="852" y="517" text-anchor="middle" font-size="10.5" fill="#495057">настройка: ai.command в config.json</text>
  <text x="852" y="534" text-anchor="middle" font-size="10.5" fill="#495057">read-only · промпт на stdin · 180 с</text>

  <!-- Артефакты -->
  <rect x="245" y="455" width="445" height="160" rx="10" fill="#F8F9FA" stroke="#495057" stroke-width="1.6"/>
  <text x="467" y="480" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">Артефакты — что создаётся</text>
  <text x="265" y="506" font-size="11" fill="#212529">📄 lkdr.db — SQLite-база чеков</text>
  <text x="265" y="528" font-size="11" fill="#212529">📄 reports/lkdr-ГГГГ-ММ.html — HTML-отчёт месяца (AI-карточки)</text>
  <text x="265" y="550" font-size="11" fill="#212529">📄 текстовый отчёт — консоль (make lkdr-report)</text>
  <text x="265" y="572" font-size="11" fill="#212529">📄 markdown-отчёт — агент выводит в чат (LKDR_FORMAT=md)</text>
  <text x="265" y="596" font-size="10" fill="#6c757d">файлы с реальными данными gitignored — не коммитятся</text>

  <!-- ===================== Связи ===================== -->

  <!-- Мои чеки онлайн → Парсер -->
  <line x1="200" y1="255" x2="245" y2="255" stroke="#343A40" stroke-width="2" marker-end="url(#m-dark)"/>
  <text x="222" y="247" text-anchor="middle" font-size="9.5" fill="#495057">чеки</text>

  <!-- Парсер → SQLite -->
  <line x1="475" y1="250" x2="525" y2="250" stroke="#343A40" stroke-width="2" marker-end="url(#m-dark)"/>
  <text x="500" y="241" text-anchor="middle" font-size="9" fill="#495057">UPSERT</text>

  <!-- SQLite → Python -->
  <line x1="685" y1="250" x2="725" y2="250" stroke="#343A40" stroke-width="2" marker-end="url(#m-dark)"/>
  <text x="705" y="241" text-anchor="middle" font-size="9.5" fill="#495057">чтение</text>

  <!-- Python → AI CLI (промпт) -->
  <path d="M790,325 L790,455" fill="none" stroke="#D6336C" stroke-width="2" marker-end="url(#m-rose)"/>
  <text x="798" y="385" font-size="10" fill="#D6336C">агрегаты · промпт</text>
  <text x="798" y="399" font-size="10" fill="#D6336C">на stdin</text>

  <!-- AI CLI → Python (выводы) -->
  <path d="M905,455 L905,325" fill="none" stroke="#D6336C" stroke-width="2" marker-end="url(#m-rose)"/>
  <text x="913" y="385" font-size="10" fill="#D6336C">AI-выводы ·</text>
  <text x="913" y="399" font-size="10" fill="#D6336C">JSON-карточки</text>

  <!-- Python → Артефакты -->
  <path d="M770,325 L770,398 L620,398 L620,455" fill="none" stroke="#343A40" stroke-width="2" marker-end="url(#m-dark)"/>
  <text x="695" y="391" text-anchor="middle" font-size="10" fill="#495057">пишет отчёты</text>

  <!-- Пользователь ⇄ AI-агент (чат) -->
  <line x1="220" y1="46" x2="280" y2="46" stroke="#0CA678" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#m-teal-r)" marker-end="url(#m-teal)"/>
  <text x="250" y="38" text-anchor="middle" font-size="10" fill="#0B7A5E">чат</text>

  <!-- AGENTS.md → AI-агент -->
  <path d="M700,46 H484" fill="none" stroke="#0CA678" stroke-width="1.6" marker-end="url(#m-teal)"/>
  <text x="592" y="38" text-anchor="middle" font-size="10" fill="#0B7A5E">инструкции</text>

  <!-- Пользователь → Makefile -->
  <path d="M140,72 L140,92 L240,92 L240,112" fill="none" stroke="#868E96" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#m-gray)"/>

  <!-- AI-агент → Makefile -->
  <path d="M380,72 L380,112" fill="none" stroke="#0CA678" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#m-teal)"/>
  <text x="390" y="96" font-size="9.5" fill="#0B7A5E">запускает цели</text>

  <!-- Makefile → Парсер -->
  <path d="M300,156 L300,175" fill="none" stroke="#868E96" stroke-width="1.6" marker-end="url(#m-gray)"/>
  <text x="292" y="169" text-anchor="end" font-size="9" fill="#495057">parse</text>

  <!-- Makefile → Python -->
  <path d="M590,134 H760 V175" fill="none" stroke="#868E96" stroke-width="1.6" marker-end="url(#m-gray)"/>
  <text x="675" y="127" text-anchor="middle" font-size="9" fill="#495057">отчёты</text>

  <!-- ===================== Легенда ===================== -->

  <line x1="40" y1="655" x2="80" y2="655" stroke="#343A40" stroke-width="2.5"/>
  <text x="88" y="659" font-size="10.5" fill="#495057">поток данных: чеки → база → отчёты</text>

  <line x1="520" y1="655" x2="560" y2="655" stroke="#D6336C" stroke-width="2.5"/>
  <text x="568" y="659" font-size="10.5" fill="#495057">прямой вызов AI CLI из Python-скриптов</text>

  <line x1="40" y1="680" x2="80" y2="680" stroke="#0CA678" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="88" y="684" font-size="10.5" fill="#495057">AI-агент: AGENTS.md · чат · make-цели</text>

  <line x1="520" y1="680" x2="560" y2="680" stroke="#868E96" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="568" y="684" font-size="10.5" fill="#495057">ручной запуск пользователем</text>

  <!-- пасхалка: приглядитесь к правому нижнему углу -->
  <text x="975" y="703" text-anchor="end" font-size="15" opacity="0.22">🦊</text>
</svg>
