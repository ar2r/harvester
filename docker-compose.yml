# Мок-сервис API ЛК ФНС «Мои чеки онлайн» для интеграционного тестирования.
#
# Запуск:
#   docker compose up -d mocklkdr
#
# Подключение приложения — в config.json указать адрес мока:
#   "lkdr": { "apiUrl": "http://127.0.0.1:18080", ... }
#
# Сервис отдаёт детерминированный набор чеков (internal/mocklkdr):
# 3 чека за сентябрь 2026, 2 бренда, фискальные детали с товарами.
# Авторизация: любой код SMS проходит, капча не проверяется.

services:
  mocklkdr:
    build:
      context: .
      dockerfile: docker/mocklkdr.Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
